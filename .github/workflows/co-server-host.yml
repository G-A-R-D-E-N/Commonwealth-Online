name: Host GUI (Avalonia)

on:
  push:
    branches: ["ci/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test Avalonia host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: "8.0.x"

      - name: Build host
        run: dotnet build CO-SERVER/host/CommonwealthOnline.Host.csproj -c Release --nologo

      - name: Test server launch contracts
        run: dotnet run --project CO-SERVER/host-tests/CommonwealthOnline.Host.Tests.csproj -c Release

  report:
    name: Report to the private PR
    needs: [build]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    environment: co-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Post the result as a commit status on the private commit
        env:
          GH_TOKEN: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source=$(git log -1 --format=%B | sed -n 's/^Source-Commit: \([0-9a-f]\{40\}\)$/\1/p')
          [ -n "$source" ] || { echo "::error::no Source-Commit trailer"; exit 1; }
          failed=$(jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped") | .key) | join(", ")' <<<"$NEEDS")
          ran=$(jq '[.[] | select(.result != "skipped")] | length' <<<"$NEEDS")
          if [ -n "$failed" ]; then state=failure; description="failed: $failed"
          elif [ "$ran" -eq 0 ]; then state=success; description="skipped (all jobs gated off)"
          else state=success; description="passed"; fi
          gh api "repos/G-A-R-D-E-N/Commonwealth-Online-Private/statuses/$source" -f state="$state" \
            -f context="public-ci/co-server-host" -f target_url="$RUN_URL" -f description="${description:0:140}" >/dev/null
          echo "$state posted for co-server-host ($description)"
