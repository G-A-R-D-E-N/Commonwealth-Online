name: Release Acceptance

on:
  push:
    branches: ["ci-skipped/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux-release:
    name: Linux native release runtime acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: false

      - name: Restore and provision the CO cross toolchain
        uses: ./.github/actions/co-toolchain

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: "8.0.x"

      - name: Set up xmake
        uses: ./.github/actions/co-xmake

      - name: Verify native release dependencies
        run: |
          set -euo pipefail
          for tool in git cmake ninja protoc clang xmake readelf ldd ss; do
            command -v "$tool" >/dev/null || { echo "::error::missing build dependency: $tool"; exit 1; }
          done
          test -f /usr/include/openssl/ssl.h || { echo "::error::missing libssl-dev headers"; exit 1; }
          test -f /usr/include/openssl/rand.h || { echo "::error::missing OpenSSL random headers"; exit 1; }

      - name: Configure native release scratch
        run: |
          echo "CO_GNS_DEPS_DIR=$RUNNER_TEMP/co-release-gns-deps-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "CO_GNS_BUILD_DIR=$RUNNER_TEMP/co-release-gns-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "CO_NATIVE_PACKAGE_DIR=$RUNNER_TEMP/co-release-native-linux-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Restore the compile cache
        uses: ./.github/actions/co-ccache

      - name: Build clean native Linux release package
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/co-release-linux-env-${{ github.run_id }}-${{ github.run_attempt }}"
          bash CO-SERVER/server-cpp/scripts/build-native-package-ci.sh \
            linux-x64 "$CO_NATIVE_PACKAGE_DIR" | tee "$env_file"
          grep '^CO_NATIVE_' "$env_file" >> "$GITHUB_ENV"

      - name: Verify Host launches the packaged native server
        run: |
          dotnet run --project CO-SERVER/host-tests/CommonwealthOnline.Host.Tests.csproj -c Release -- \
            --package-smoke "$CO_NATIVE_PACKAGE_DIR" "$CO_NATIVE_PACKAGE_DIR/commonwealth-server.json"

      - name: Verify packaged gameplay transport
        run: |
          bash CO-SERVER/server-cpp/scripts/smoke-native-linux-package.sh \
            "$CO_NATIVE_PACKAGE_DIR" "$CO_NATIVE_SMOKE" "$CO_NATIVE_BRIDGE_DIR"

      - name: Verify packaged identity, restart persistence, and admin control
        run: |
          bash CO-SERVER/server-cpp/scripts/smoke-native-linux-release.sh \
            "$CO_NATIVE_PACKAGE_DIR" \
            "$CO_NATIVE_IDENTITY_SMOKE" \
            "$CO_NATIVE_PERSISTENCE_SMOKE" \
            "$CO_NATIVE_ADMIN_SMOKE" \
            "$CO_NATIVE_PROFILE_BAN_SMOKE" \
            "$CO_NATIVE_BRIDGE_DIR"

      - name: Clean Linux release scratch
        if: always()
        run: rm -rf "$CO_GNS_DEPS_DIR" "$CO_GNS_BUILD_DIR" "$CO_NATIVE_PACKAGE_DIR"

  report:
    name: Report to the private PR
    needs: [linux-release]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Post the result as a commit status on the private commit
        uses: ./.github/actions/co-report
        with:
          context: public-ci/co-server-release-acceptance
          needs: ${{ toJSON(needs) }}
