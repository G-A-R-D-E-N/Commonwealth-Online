name: Commonwealth Online Website

on:
  push:
    branches: [main]
    paths:
      - "Website/**"
      - ".github/workflows/co-website-static.yml"
  pull_request:
    branches: [main]
    paths:
      - "Website/**"
      - ".github/workflows/co-website-static.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-static:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"

      - name: Verify Node tools
        run: |
          set -euo pipefail
          command -v node >/dev/null
          command -v npm >/dev/null
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"

      - name: Install website dependencies
        working-directory: Website
        run: npm ci

      - name: Run website tests
        working-directory: Website
        run: npm test

      - name: Build static website
        working-directory: Website
        run: npm run build:static

      - name: Verify static website and backend boundary
        working-directory: Website
        run: npm run test:static

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Build GitHub Pages artifact
        if: github.event_name != 'pull_request'
        working-directory: Website
        env:
          STATIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:static

      - name: Verify GitHub Pages paths
        if: github.event_name != 'pull_request'
        env:
          STATIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          grep -q "href=\"${STATIC_BASE_PATH}/" Website/dist/index.html
          grep -q "src=\"${STATIC_BASE_PATH}/static/" Website/dist/index.html
          grep -q "\"${STATIC_BASE_PATH}/data/servers.json\"" Website/dist/static/js/servers.js
          grep -q "\"${STATIC_BASE_PATH}/updates\"" Website/dist/static/js/links.js

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          name: github-pages-${{ github.run_attempt }}
          path: Website/dist

      - name: Whitespace check
        if: always()
        run: git diff --check

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: website-static
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
