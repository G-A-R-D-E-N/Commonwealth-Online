name: Beta Release Stage Contract

on:
  push:
    branches: ["ci/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-stage-contract:
    name: Windows strict release staging contract
    if: vars.WINDOWS_RUNTIME_SMOKE == 'true'
    runs-on: windows-latest
    env:
      _MSPDBSRV_ENDPOINT_: co-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            CO-BETA/ci/test-stage-mod-release.ps1
            CO-BETA/stage-mod.bat
            CO-BETA/tools/
            CO-BETA/creation-kit/esp/
            CO-BETA/creation-kit/scripts/compiled/
            CO-BETA/creation-kit/scripts/source/
            CO-BETA/creation-kit/assets/DataFolder/
            .gitignore
          sparse-checkout-cone-mode: false

      - name: Exercise strict and developer staging modes
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -Command "$p='${{ github.workspace }}\CO-BETA\ci\test-stage-mod-release.ps1'; $s=[IO.File]::ReadAllText($p).Replace('$PSScriptRoot',([char]39+(Split-Path -Parent $p)+[char]39)); Invoke-Expression $s"

      - name: Whitespace check
        shell: cmd
        run: git diff --check

  report:
    name: Report to the private PR
    needs: [release-stage-contract]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    environment: co-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Post the result as a commit status on the private commit
        env:
          GH_TOKEN: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source=$(git log -1 --format=%B | sed -n 's/^Source-Commit: \([0-9a-f]\{40\}\)$/\1/p')
          [ -n "$source" ] || { echo "::error::no Source-Commit trailer"; exit 1; }
          failed=$(jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped") | .key) | join(", ")' <<<"$NEEDS")
          ran=$(jq '[.[] | select(.result != "skipped")] | length' <<<"$NEEDS")
          if [ -n "$failed" ]; then state=failure; description="failed: $failed"
          elif [ "$ran" -eq 0 ]; then state=success; description="skipped (all jobs gated off)"
          else state=success; description="passed"; fi
          gh api "repos/G-A-R-D-E-N/Commonwealth-Online-Private/statuses/$source" -f state="$state" \
            -f context="public-ci/co-beta-release-stage-contract" -f target_url="$RUN_URL" -f description="${description:0:140}" >/dev/null
          echo "$state posted for co-beta-release-stage-contract ($description)"
