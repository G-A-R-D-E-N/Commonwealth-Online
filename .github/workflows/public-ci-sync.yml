name: Public CI sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Export again even if the commit already has finished results
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PUBLIC_REPO: G-A-R-D-E-N/Commonwealth-Online
  PRIVATE_REPO: G-A-R-D-E-N/Commonwealth-Online-Private

jobs:
  sync:
    name: Export open PRs and mainline heads
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Initialise the workspace repository
        run: git init -q "$GITHUB_WORKSPACE"

      - name: Export open PRs and mainline heads to the public repository
        env:
          FORCE: ${{ inputs.force }}
          TOKEN: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
          GH_TOKEN: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
          REPOSITORY: ${{ env.PRIVATE_REPO }}
          GIT_AUTHOR_NAME: NomadsReach
          GIT_AUTHOR_EMAIL: 144523850+NomadsReach@users.noreply.github.com
          GIT_COMMITTER_NAME: NomadsReach
          GIT_COMMITTER_EMAIL: 144523850+NomadsReach@users.noreply.github.com
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::CO_PUBLIC_CI_TOKEN is not set"; exit 1; }
          public_url="https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git"
          private_url="https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          work="$RUNNER_TEMP/public-ci-sync"
          mkdir -p "$work"
          gh api --paginate "repos/${REPOSITORY}/pulls?state=open&per_page=100" --jq ".[] | select(.head.repo.full_name == \"${REPOSITORY}\") | \"\(.number) \(.head.sha)\"" > "$work/prs.txt"
          cut -d' ' -f1 "$work/prs.txt" > "$work/open.txt"

          export_one() {
            local branch=$1 head=$2 pr=$3 current source states scan message commit workflow name state description
            current=$(git ls-remote "$public_url" "refs/heads/$branch" | cut -f1) || return 1
            if [ -n "$current" ]; then
              source=$(gh api "repos/${PUBLIC_REPO}/commits/${current}" --jq .commit.message) || return 1
              if grep -qx "Source-Commit: ${head}" <<<"$source"; then return 0; fi
            fi
            # Finished commits lose their branch to the cleanup sweep, so their statuses stop a re-export.
            states=$(gh api "repos/${REPOSITORY}/commits/${head}/status?per_page=100" --jq '[.statuses[] | select(.context | startswith("public-ci/")) | .state] | unique | join(" ")') || return 1
            if [ "$FORCE" != true ] && [ -n "$states" ] && ! grep -qw pending <<<"$states"; then return 0; fi
            git fetch -q --no-tags --depth 1 "$private_url" "$head" || return 1
            git checkout -q --detach FETCH_HEAD || return 1
            [ -n "$(git ls-tree -d HEAD .github/public-ci/workflows)" ] || { echo "::warning::no public CI workflows on ${branch}; skipped"; return 0; }
            mkdir -p "$GITHUB_WORKSPACE/.trusted-export" || return 1
            git fetch -q --no-tags --depth 1 "$private_url" "+refs/heads/nomad-dev:refs/trusted/nomad-dev" || return 1
            git show refs/trusted/nomad-dev:scripts/export-public-ci.py > "$GITHUB_WORKSPACE/.trusted-export/export-public-ci.py" || return 1
            : > "$work/changed.txt"
            if [ -n "$pr" ]; then
              gh api --paginate "repos/${REPOSITORY}/pulls/${pr}/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$work/changed.txt" || return 1
              [ "$(wc -l < "$work/changed.txt")" -lt 2900 ] || : > "$work/changed.txt"
            fi
            : > "$work/skipped.txt"
            : > "$work/blocked.txt"
            : > "$work/windows.txt"
            scan=0; git grep -q -E -e '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----' -e 'gh[opsru]_[A-Za-z0-9]{30,}' -e 'github_pat_[A-Za-z0-9_]{20,}' -e 'sk-live-[A-Za-z0-9]{20,}' -e 'xox[baprs]-[A-Za-z0-9-]{10,}' HEAD -- . ':!scripts/export-public-ci.py' ':!.github/public-ci/sync/public-ci-sync.yml' || scan=$?
            [ "$scan" -le 1 ] || return 1
            if [ "$scan" = 0 ]; then
              echo "::error::secret-like pattern found in ${head}; refusing public export; run git grep on that commit privately"
              return 1
            fi
            message=$(printf 'Commonwealth Online %s\n\nSource-Commit: %s' "$branch" "$head")
            commit=$(PUBLIC_CI_CHANGED_FILE="$work/changed.txt" PUBLIC_CI_SKIPPED_FILE="$work/skipped.txt" PUBLIC_CI_BLOCKED_FILE="$work/blocked.txt" PUBLIC_CI_WINDOWS_ONLY_FILE="$work/windows.txt" python3 "$GITHUB_WORKSPACE/.trusted-export/export-public-ci.py" HEAD "$message") || return 1
            for workflow in $(grep -l 'context="public-ci/' .github/public-ci/workflows/*.yml); do
              name=$(basename "$workflow" .yml)
              state=pending; description="Building on GitHub-hosted runners"
              if grep -qx "$name" "$work/blocked.txt"; then state=failure; description="Blocked: compiles on Linux without the linux-compile marker"
              elif grep -qx "$name" "$work/windows.txt"; then state=success; description="Runs on Windows only"
              elif grep -qx "$name" "$work/skipped.txt"; then state=success; description="Not affected by the files this PR changes"; fi
              gh api "repos/${REPOSITORY}/statuses/${head}" -f state="$state" -f context="public-ci/${name}" \
                -f target_url="https://github.com/${PUBLIC_REPO}/actions?query=branch%3A${branch}" \
                -f description="$description" >/dev/null || return 1
            done
            git push -q --force "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" "${commit}:refs/heads/${branch}" || return 1
            echo "exported ${head:0:8} as ${commit:0:8} to ${PUBLIC_REPO} ${branch}"
          }

          failed=0
          while IFS=' ' read -r pr head; do
            if ! export_one "ci/pr-${pr}" "$head" "$pr"; then
              echo "::error::export failed for PR #${pr}"
              failed=1
            fi
          done < "$work/prs.txt"
          for branch in main nomad-dev; do
            head=$(gh api "repos/${REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha) || { echo "::error::cannot read ${branch}"; failed=1; continue; }
            if ! export_one "ci/${branch}" "$head" ""; then
              echo "::error::export failed for ${branch}"
              failed=1
            fi
          done
          git ls-remote --heads "$public_url" "refs/heads/ci/pr-*" > "$work/public-prs.txt"
          while IFS=$'\t' read -r _ ref; do
            number=${ref##*/ci/pr-}
            if ! grep -qx "$number" "$work/open.txt"; then
              git push -q "$public_url" --delete "${ref#refs/heads/}" || failed=1
            fi
          done < "$work/public-prs.txt"
          exit "$failed"

      - name: Start the next sync
        if: ${{ !cancelled() && github.repository == 'G-A-R-D-E-N/Commonwealth-Online' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
        run: |
          sleep 240
          gh workflow run public-ci-sync.yml --repo "$GITHUB_REPOSITORY" --ref main
