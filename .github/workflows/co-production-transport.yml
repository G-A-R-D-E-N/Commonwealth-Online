name: Production Transport Contract

on:
  push:
    branches: ["ci/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: GNS-only production path
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: false

      - name: Verify production transport
        run: python3 scripts/verify-production-transport.py

      - name: Verify transport contract rejection cases
        run: python3 tests/audit/test_production_transport_contract.py

      - name: Verify native acceptance coverage
        run: bash CO-SERVER/server-cpp/scripts/verify-native-acceptance-matrix.sh

      - name: Enforce repository runtime policy
        run: bash CO-SERVER/server/scripts/verify-no-legacy-runtime.sh

      - name: Check native and bridge script syntax
        run: |
          set -euo pipefail
          for script in \
            CO-SERVER/server/scripts/build-gns-bridge.sh \
            CO-SERVER/server/scripts/build-gns-bridge-windows-cross.sh \
            CO-SERVER/server/scripts/verify-no-legacy-runtime.sh \
            CO-SERVER/server-cpp/scripts/build-native-package-ci.sh \
            CO-SERVER/server-cpp/scripts/free-port.sh \
            CO-SERVER/server-cpp/scripts/package-native-release.sh \
            CO-SERVER/server-cpp/scripts/smoke-native-linux-package.sh \
            CO-SERVER/server-cpp/scripts/smoke-native-linux-release.sh \
            CO-SERVER/server-cpp/scripts/verify-native-acceptance-matrix.sh \
            CO-SERVER/server-cpp/scripts/verify-native-release-path.sh; do
            bash -n "$script"
          done

  report:
    name: Report to the private PR
    needs: [contract]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    environment: co-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Post the result as a commit status on the private commit
        env:
          GH_TOKEN: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source=$(git log -1 --format=%B | sed -n 's/^Source-Commit: \([0-9a-f]\{40\}\)$/\1/p')
          [ -n "$source" ] || { echo "::error::no Source-Commit trailer"; exit 1; }
          failed=$(jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped") | .key) | join(", ")' <<<"$NEEDS")
          ran=$(jq '[.[] | select(.result != "skipped")] | length' <<<"$NEEDS")
          if [ -n "$failed" ]; then state=failure; description="failed: $failed"
          elif [ "$ran" -eq 0 ]; then state=success; description="skipped (all jobs gated off)"
          else state=success; description="passed"; fi
          gh api "repos/G-A-R-D-E-N/Commonwealth-Online-Private/statuses/$source" -f state="$state" \
            -f context="public-ci/co-production-transport" -f target_url="$RUN_URL" -f description="${description:0:140}" >/dev/null
          echo "$state posted for co-production-transport ($description)"
