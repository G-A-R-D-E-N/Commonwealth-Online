name: CO UI Prisma contract

on:
  push:
    branches: ["ci/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prisma-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Block Linux compile
        working-directory: ${{ github.workspace }}
        run: |
          shim="$RUNNER_TEMP/no-compile/bin"
          mkdir -p "$shim"
          for tool in c++ g++ gcc cc clang clang++ cmake xmake make ninja cargo; do
            printf '#!/bin/sh\necho "::error::Linux compile is blocked here; only the server and launcher compile on Linux"\nexit 1\n' > "$shim/$tool"
            chmod +x "$shim/$tool"
          done
          echo "$shim" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: false
      - name: Verify Prisma V12 consumer contract
        run: python3 CommonwealthOnlineUI/scripts/check-prisma-v12-contract.py

  report:
    name: Report to the private PR
    needs: [prisma-contract]
    if: always()
    runs-on: ubuntu-24.04
    environment: co-ci
    steps:
      - name: Block Linux compile
        working-directory: ${{ github.workspace }}
        run: |
          shim="$RUNNER_TEMP/no-compile/bin"
          mkdir -p "$shim"
          for tool in c++ g++ gcc cc clang clang++ cmake xmake make ninja cargo; do
            printf '#!/bin/sh\necho "::error::Linux compile is blocked here; only the server and launcher compile on Linux"\nexit 1\n' > "$shim/$tool"
            chmod +x "$shim/$tool"
          done
          echo "$shim" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Post the result as a commit status on the private commit
        uses: ./.github/actions/co-report
        with:
          context: public-ci/co-ui-prisma-contract
          needs: ${{ toJSON(needs) }}
          token: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
