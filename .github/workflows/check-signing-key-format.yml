name: Check Signing Key Format

on:
  push:
    branches: [main]
    paths: [.github/workflows/check-signing-key-format.yml]

permissions:
  contents: read

jobs:
  key-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    steps:
      - name: Report the key format
        env:
          KEY: ${{ secrets.CO_UPDATE_SIGNING_KEY }}
          EXPECTED: ${{ vars.CO_UPDATE_PUBLIC_KEY }}
        run: |
          printf '%s\n' "$KEY" | awk '{ print "line " NR " length: " length($0) }'
          first="$(printf '%s\n' "$KEY" | sed -n 1p)"
          body="$(printf '%s\n' "$KEY" | sed -n 2p)"
          last="$(printf '%s\n' "$KEY" | sed -n 3p)"
          if [ "$first" = "-----BEGIN PRIVATE KEY-----" ]; then echo "first line exact: yes"; else echo "first line exact: no"; fi
          if [ "$last" = "-----END PRIVATE KEY-----" ]; then echo "last line exact: yes"; else echo "last line exact: no"; fi
          if printf '%s' "$body" | grep -Eq '^[A-Za-z0-9+/]+=*$'; then echo "middle only base64 letters: yes"; else echo "middle only base64 letters: no"; fi
          echo "middle starts like an ed25519 key: $(printf '%s' "$body" | grep -q '^MC4CAQAwBQYDK2Vw' && echo yes || echo no)"
          echo "middle spaces: $(printf '%s' "$body" | tr -cd ' ' | wc -c)"
          actual="$({ printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$body"; } | openssl pkey -pubout -outform DER 2>/dev/null | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          if [ -z "$actual" ]; then echo "middle with clean first and last lines: unreadable"
          elif [ "$actual" = "$EXPECTED" ]; then echo "middle with clean first and last lines: reads and matches"
          else echo "middle with clean first and last lines: reads, different key"; fi
