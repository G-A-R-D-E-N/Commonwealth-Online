name: Supabase Contract

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "Website/src/config.js"
      - "Website/src/lib/applications.js"
      - "Website/static/js/applications.js"
      - "Website/src/lib/nav.js"
      - "Website/src/routes/page-config.js"
      - "Website/scripts/build-static.js"
      - "Website/views/pages/forum.ejs"
      - "Website/static/js/forum.js"
      - "Website/.env.example"
      - ".github/workflows/supabase-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "Website/src/config.js"
      - "Website/src/lib/applications.js"
      - "Website/static/js/applications.js"
      - "Website/src/lib/nav.js"
      - "Website/src/routes/page-config.js"
      - "Website/scripts/build-static.js"
      - "Website/views/pages/forum.ejs"
      - "Website/static/js/forum.js"
      - "Website/.env.example"
      - ".github/workflows/supabase-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"

      - name: Validate Supabase contract
        run: node supabase/tests/contract.test.mjs

      - name: Prevent changes to committed migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only --diff-filter=MDR "$BASE_SHA" HEAD -- supabase/migrations/)"
          if [ -n "$changed" ]; then
            echo "Committed migrations are immutable; add a new migration instead:" >&2
            echo "$changed" >&2
            exit 1
          fi

      - name: Whitespace check
        if: always()
        run: git diff --check
