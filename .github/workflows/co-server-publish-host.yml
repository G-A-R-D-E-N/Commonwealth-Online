name: Publish Host + Native Server

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Commit SHA or tag of G-A-R-D-E-N/Commonwealth-Online-Private to build (default: main)"
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Require green CI
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    env:
      PRIVATE_REPO: G-A-R-D-E-N/Commonwealth-Online-Private
      CO_INPUT_TARGET: ${{ inputs.target }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Require green CI on the commit being released
        id: commit
        env:
          GH_TOKEN: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CO_INPUT_TARGET" | grep -Eq '^[A-Za-z0-9._/-]+$' || { echo "::error::target must be a plain branch, tag or sha"; exit 1; }
          sha="$(gh api "repos/$PRIVATE_REPO/commits/$CO_INPUT_TARGET" --jq .sha)"
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::target did not resolve to a commit"; exit 1; }
          on_branch=false
          for branch in main nomad-dev; do
            case "$(gh api "repos/$PRIVATE_REPO/compare/$sha...$branch" --jq .status)" in
              ahead|identical) on_branch=true ;;
            esac
          done
          "$on_branch" || { echo "::error::the release commit is not on the private main or nomad-dev branch"; exit 1; }
          statuses="$(gh api "repos/$PRIVATE_REPO/commits/$sha/status?per_page=100" --jq '.statuses[] | select(.context | startswith("public-ci/")) | "\(.state) \(.context)"')"
          test -n "$statuses" || { echo "::error::the release commit has no public CI results"; exit 1; }
          for context in public-ci/co-contracts public-ci/co-native-ci public-ci/co-production-transport public-ci/co-server-acceptance public-ci/co-server-host public-ci/co-server-package public-ci/co-server-release-acceptance; do
            printf '%s\n' "$statuses" | grep -qx "success $context" || { echo "::error::the release commit has no green $context result"; exit 1; }
          done
          if printf '%s\n' "$statuses" | grep -v '^success '; then
            echo "::error::the release commit has public CI results that are not green"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: G-A-R-D-E-N/Commonwealth-Online-Private
          ref: ${{ steps.commit.outputs.sha }}
          token: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
          submodules: false
          persist-credentials: false

      - name: Fetch the 1.10.163 address bin from CommonLibF4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bins" "$RUNNER_TEMP/commonlibf4"
          gh release download 1.0.0 --repo Ryan-rsm-McKenzie/CommonLibF4 --pattern AddressBins.zip --dir "$RUNNER_TEMP/commonlibf4"
          unzip -o -j "$RUNNER_TEMP/commonlibf4/AddressBins.zip" F4SE/Plugins/version-1-10-163-0.bin -d "$RUNNER_TEMP/bins"
          expected=$(jq -r '.header.bins.OG.sha256' CO-BETA/tools/engine-ids.lock.json)
          echo "$expected  $RUNNER_TEMP/bins/version-1-10-163-0.bin" | sha256sum -c -

      - name: Fetch the 1.10.984 and 1.11.240 address bins from the private prerelease
        env:
          GH_TOKEN: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
        run: |
          set -euo pipefail
          gh release download ci-address-bins --repo G-A-R-D-E-N/Commonwealth-Online-Private --dir "$RUNNER_TEMP/bins" --pattern version-1-10-984-0.bin --pattern version-1-11-240-0.bin

      - name: Check that all three address bins were fetched
        run: |
          set -euo pipefail
          for bin in version-1-10-163-0.bin version-1-10-984-0.bin version-1-11-240-0.bin; do
            test -s "$RUNNER_TEMP/bins/$bin" || { echo "::error::missing address bin $bin"; exit 1; }
          done

      - name: Check engine ids against the address bins
        working-directory: CO-BETA
        env:
          CO_ADDRESS_BINS: ${{ runner.temp }}/bins
        run: python3 tools/tests/test_engine_ids.py

  linux:
    name: Publish native linux-x64
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    env:
      CCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: G-A-R-D-E-N/Commonwealth-Online-Private
          ref: ${{ needs.gate.outputs.sha }}
          token: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
          submodules: false
          persist-credentials: false

      - name: Verify the native release path
        run: CO_REQUIRE_PUBLISHER=1 bash CO-SERVER/server-cpp/scripts/verify-native-release-path.sh

      - name: Prepare the CO toolchain directories
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/xwin /opt/prisma-toolchain

      - name: Restore the CO cross toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /opt/xwin
            /opt/prisma-toolchain
          key: co-toolchain-${{ runner.os }}-${{ hashFiles('scripts/provision-matrix-ci-toolchain.py', 'CO-BETA/ci/toolchains/xwin-clang-cl.cmake') }}

      - name: Provision the CO cross toolchain
        run: |
          set -euo pipefail
          sudo -E python3 "$GITHUB_WORKSPACE/scripts/provision-matrix-ci-toolchain.py" --provision --accept-microsoft-license
          sudo chown -R "$(id -u):$(id -g)" /opt/xwin /opt/prisma-toolchain

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: "8.0.x"

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a
        with:
          xmake-version: v3.1.0

      - name: Verify native publish dependencies
        run: |
          set -euo pipefail
          for tool in git cmake ninja protoc clang xmake readelf ldd ss; do
            command -v "$tool" >/dev/null || { echo "::error::missing build dependency: $tool"; exit 1; }
          done
          test -f /usr/include/openssl/ssl.h || { echo "::error::missing libssl-dev headers"; exit 1; }
          test -f /usr/include/openssl/rand.h || { echo "::error::missing OpenSSL random headers"; exit 1; }

      - name: Configure publish scratch
        run: |
          echo "CO_GNS_DEPS_DIR=$RUNNER_TEMP/co-publish-gns-deps-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "CO_GNS_BUILD_DIR=$RUNNER_TEMP/co-publish-gns-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "CO_NATIVE_PACKAGE_DIR=$RUNNER_TEMP/co-publish-native-linux-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Build native Linux publish package
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/co-publish-linux-env-${{ github.run_id }}-${{ github.run_attempt }}"
          bash CO-SERVER/server-cpp/scripts/build-native-package-ci.sh \
            linux-x64 "$CO_NATIVE_PACKAGE_DIR" | tee "$env_file"
          grep '^CO_NATIVE_' "$env_file" >> "$GITHUB_ENV"

      - name: Smoke published native package
        run: |
          bash CO-SERVER/server-cpp/scripts/smoke-native-linux-package.sh \
            "$CO_NATIVE_PACKAGE_DIR" "$CO_NATIVE_SMOKE" "$CO_NATIVE_BRIDGE_DIR"

      - name: Clean publish scratch
        if: always()
        run: rm -rf "$CO_GNS_DEPS_DIR" "$CO_GNS_BUILD_DIR" "$CO_NATIVE_PACKAGE_DIR"

  windows-cross:
    name: Publish native win-x64
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    env:
      XWIN_ROOT: ${{ vars.XWIN_ROOT || '/opt/xwin' }}
      CCACHE_DISABLE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: G-A-R-D-E-N/Commonwealth-Online-Private
          ref: ${{ needs.gate.outputs.sha }}
          token: ${{ secrets.CO_PUBLIC_CI_TOKEN }}
          submodules: false
          persist-credentials: false

      - name: Prepare the CO toolchain directories
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/xwin /opt/prisma-toolchain

      - name: Restore the CO cross toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /opt/xwin
            /opt/prisma-toolchain
          key: co-toolchain-${{ runner.os }}-${{ hashFiles('scripts/provision-matrix-ci-toolchain.py', 'CO-BETA/ci/toolchains/xwin-clang-cl.cmake') }}

      - name: Provision the CO cross toolchain
        run: |
          set -euo pipefail
          sudo -E python3 "$GITHUB_WORKSPACE/scripts/provision-matrix-ci-toolchain.py" --provision --accept-microsoft-license
          sudo chown -R "$(id -u):$(id -g)" /opt/xwin /opt/prisma-toolchain

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: "8.0.x"

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a
        with:
          xmake-version: v3.1.0

      - name: Verify xwin publish toolchain
        run: |
          set -euo pipefail
          for tool in clang-cl lld-link llvm-ar llvm-rc llvm-dlltool llvm-readobj xmake cmake ninja protoc; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing"; exit 1; }
          done
          test -d "$XWIN_ROOT/crt/include" || { echo "::error::missing xwin CRT"; exit 1; }
          test -d "$XWIN_ROOT/sdk/include/ucrt" || { echo "::error::missing xwin SDK"; exit 1; }

      - name: Configure Windows publish scratch
        run: |
          echo "CO_WIN_DEPS_DIR=$RUNNER_TEMP/co-publish-win-deps-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "CO_WIN_BUILD_DIR=$RUNNER_TEMP/co-publish-win-build-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          echo "CO_NATIVE_PACKAGE_DIR=$RUNNER_TEMP/co-publish-native-win-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Build native Windows publish package
        run: |
          bash CO-SERVER/server-cpp/scripts/build-native-package-ci.sh \
            win-x64 "$CO_NATIVE_PACKAGE_DIR"

      - name: Clean publish scratch
        if: always()
        run: rm -rf "$CO_WIN_DEPS_DIR" "$CO_WIN_BUILD_DIR" "$CO_NATIVE_PACKAGE_DIR"
