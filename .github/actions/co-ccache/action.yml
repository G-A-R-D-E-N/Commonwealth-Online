name: CO compile cache
description: Restore ccache and the prebuilt protobuf for this job, and turn ccache on
inputs:
  lane:
    description: Matrix lane that shares this job id
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.ccache
          ~/.cache/co-ci/protobuf-*
          ~/.cache/co-ci/gns-*
        key: co-ccache-${{ runner.os }}-${{ github.job }}-${{ inputs.lane }}-${{ github.sha }}
        restore-keys: co-ccache-${{ runner.os }}-${{ github.job }}-${{ inputs.lane }}-
    - shell: bash
      run: |
        if ! command -v ccache >/dev/null 2>&1; then
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ccache || echo "::warning::ccache did not install; compiling without it"
        fi
        bash "$GITHUB_WORKSPACE/scripts/ci-ccache-env.sh"
