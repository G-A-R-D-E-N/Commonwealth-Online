<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonwealth Online — Chat Feed Preview</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        background: linear-gradient(165deg, #09120b 0%, #101a12 45%, #060c07 100%) !important;
      }
      .preview-hint {
        position: fixed;
        left: 28px;
        bottom: 28px;
        font-family: "Bahnschrift", "Arial Narrow", Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(154, 168, 152, 0.7);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <p class="preview-hint">In-Game Chat Feed HUD Preview · Bottom-Right</p>
    <ol class="chat-feed" id="coChatFeed" aria-live="off"></ol>
    <script src="../shared/faction-tag.js"></script>
    <script src="feed.js"></script>
    <script>
      var sampleMessages = [
        { channel: "global", fromName: "VaultDweller_92", text: "Spotted legendary deathclaw south of Concord." },
        { channel: "faction", fromName: "Paladin_Danse", text: "Regroup at Cambridge Police Station immediately." },
        { channel: "global", fromName: "Hancock", text: "Goodneighbor doors are always open, friends." }
      ];
      sampleMessages.forEach(function (msg) {
        window.coChatEvent({ kind: "message", message: msg });
      });
    </script>
  </body>
</html>
