<!DOCTYPE html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonwealth Online — Structure</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="co-structure-hud" id="coStructureHud" aria-live="off" hidden>
