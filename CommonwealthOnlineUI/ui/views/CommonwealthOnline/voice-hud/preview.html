<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonwealth Online — Voice HUD Preview</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        background: linear-gradient(165deg, #09120b 0%, #101a12 45%, #060c07 100%) !important;
      }
      .preview-hint {
        position: fixed;
        left: 28px;
        bottom: 28px;
        font-family: "Bahnschrift", "Arial Narrow", Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(154, 168, 152, 0.7);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="co-voice-hud">
      <p class="co-voice-mic" id="coVoiceMic" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0h-2a5 5 0 0 1-10 0z" />
          <rect x="11" y="18" width="2" height="4" />
          <rect x="8" y="21" width="8" height="2" />
        </svg>
        <span>Mic On · Transmitting</span>
      </p>
      <ol class="co-voice-speakers" id="coVoiceSpeakers"></ol>
      <p class="co-voice-pending" id="coVoicePending" hidden>Syncing voice settings</p>
    </div>
    <p class="preview-hint">Voice HUD preview · top-left squad comms</p>
    <script src="voice-hud.js"></script>
    <script>
      window.coVoiceEvent({ kind: "status", active: true, micHot: true, pending: false });
      window.coVoiceEvent({
        kind: "players",
        players: [
          { playerId: 1, name: "Paladin_Danse" },
          { playerId: 2, name: "VaultDweller_92" },
          { playerId: 3, name: "SilverShroud" }
        ]
      });
      window.coVoiceEvent({ kind: "speakers", playerIds: [1, 2] });
    </script>
  </body>
</html>
