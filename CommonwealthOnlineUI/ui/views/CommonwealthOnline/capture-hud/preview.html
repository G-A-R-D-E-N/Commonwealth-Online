<!DOCTYPE html>
<html lang="en" class="is-preview">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonwealth Online — Capture HUD Preview</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        background: linear-gradient(165deg, #0b120d 0%, #121810 45%, #080c08 100%) !important;
      }
    </style>
  </head>
  <body>
    <div class="co-capture-hud" id="coCaptureHud" aria-live="polite" hidden>
      <p class="co-capture-name" id="coCaptureName"></p>
      <div class="co-capture-bar" id="coCaptureBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="co-capture-fill" id="coCaptureFill"></div>
      </div>
      <p class="co-capture-status" id="coCaptureStatus"></p>
      <p class="co-capture-message" id="coCaptureMessage" hidden></p>
      <div class="co-capture-workbench" id="coWorkbench" hidden>
        <p class="co-capture-workbench-label" id="coWorkbenchLabel"></p>
        <div class="co-capture-bar" id="coWorkbenchBar" role="progressbar" aria-label="Workbench health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="co-capture-hp-fill" id="coWorkbenchFill"></div>
        </div>
      </div>
      <p class="co-capture-protection" id="coProtection" hidden></p>
      <p class="co-capture-self" id="coSelfProtection" hidden></p>
    </div>
    <script src="capture-hud.js"></script>
    <script>
      var samples = [
        { settlements: [{ buildZoneId: 1, name: "Sanctuary Hills", state: "neutral" }], nearBuildZoneId: 1, promptCapture: true, localProgress: 0 },
        { settlements: [{ buildZoneId: 1, name: "Sanctuary Hills", state: "capturing", progressPercent: 45, secondsLeft: 66 }], nearBuildZoneId: 1, localProgress: 45 },
        { settlements: [{ buildZoneId: 1, name: "Sanctuary Hills", state: "contested", progressPercent: 30, secondsLeft: 0 }], nearBuildZoneId: 1, localProgress: null },
        { settlements: [{ buildZoneId: 1, name: "Sanctuary Hills", state: "owned", ownerName: "Nomad", workbenchHp: 2000, workbenchMaxHp: 2000, workbenchBroken: false, raidProtection: { active: true, reason: "settlementProtected", secondsLeft: 11520 } }], nearBuildZoneId: 1, localProgress: null },
        { settlements: [{ buildZoneId: 1, name: "Sanctuary Hills", state: "owned", ownerName: "Nomad", workbenchHp: 2000, workbenchMaxHp: 2000, workbenchBroken: false, raidProtection: { active: true, reason: "ownerNewPlayer", secondsLeft: 169200 } }], nearBuildZoneId: 1, localProgress: null },
        { settlements: [{ buildZoneId: 1, name: "Sanctuary Hills", state: "owned", ownerName: "Nomad", workbenchHp: 1850, workbenchMaxHp: 2000, workbenchBroken: false, raidProtection: { active: false, secondsLeft: 0 } }], nearBuildZoneId: 1, localProgress: null },
        { settlements: [{ buildZoneId: 1, name: "Sanctuary Hills", state: "owned", ownerName: "Nomad", workbenchHp: 0, workbenchMaxHp: 2000, workbenchBroken: true, raidProtection: { active: false, secondsLeft: 0 } }], nearBuildZoneId: 1, localProgress: null },
        { settlements: [], nearBuildZoneId: null, selfRaidProtection: { active: true, secondsLeft: 169200 }, localProgress: null },
        { settlements: [], nearBuildZoneId: null, localProgress: null }
      ];
      var sampleIndex = 0;
      function showSample() {
        window.coCaptureSetState(JSON.stringify(samples[sampleIndex]));
        sampleIndex = (sampleIndex + 1) % samples.length;
      }
      showSample();
      setInterval(showSample, 3000);
    </script>
  </body>
</html>
