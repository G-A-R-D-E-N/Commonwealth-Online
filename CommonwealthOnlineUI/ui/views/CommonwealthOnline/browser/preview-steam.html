<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Commonwealth Online — Steam Friends &amp; Lobby Preview</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./modpack-detail.css">
<link rel="stylesheet" href="./components/keyboard.css">
<link rel="stylesheet" href="./browser-modal.css">
<link rel="stylesheet" href="./components/server-settings.css">
<link rel="stylesheet" href="../settings/settings.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(165deg, #070d09 0%, #0c140d 45%, #050805 100%) !important;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div id="coBrowserMount"></div>
  <script src="./components/layout.js"></script>
  <script src="./components/theme.js"></script>
  <script src="./components/mock-data.js"></script>
  <script src="./components/tabs.js"></script>
  <script src="./components/filters.js"></script>
  <script src="./components/select-menus.js"></script>
  <script src="./components/server-list.js"></script>
  <script src="./components/server-details.js"></script>
  <script src="./components/controller-glyphs.js"></script>
  <script src="./components/controller-icons.js"></script>
  <script src="./components/controller-prompts.js"></script>
  <script src="./components/direct-connect.js"></script>
  <script src="./components/steam-lan.js"></script>
  <script src="./components/steam-friends.js"></script>
  <script src="./components/server-settings.js"></script>
  <script src="./components/hover.js"></script>
  <script src="./components/text-focus.js"></script>
  <script src="./components/controller-input.js"></script>
  <script src="./components/keyboard.js"></script>
  <script src="./components/controller-trace.js"></script>
  <script src="./components/browser-markup.js"></script>
  <script src="./components/share-log.js"></script>
  <script src="./components/modpack-detail.js"></script>
  <script src="./components/modpack-copy.js"></script>
  <script src="./components/server-records.js"></script>
  <script src="./components/recent-servers.js"></script>
  <script src="./components/filter-state.js"></script>
  <script src="./components/server-counts.js"></script>
  <script src="./components/join-flow.js"></script>
  <script src="./components/session-state.js"></script>
  <script src="./components/password-prompt.js"></script>
  <script src="./components/controller-navigation.js"></script>
  <script src="./components/directory-refresh.js"></script>
  <script src="../settings/settings-data.js"></script>
  <script src="../settings/settings-model.js"></script>
  <script src="../settings/settings-native.js"></script>
  <script src="../settings/settings-render.js"></script>
  <script src="../settings/settings-input.js"></script>
  <script src="../settings/settings.js"></script>
  <script src="./browser.js"></script>
  <script>
    (function () {
      var mount = document.getElementById("coBrowserMount");
      window.coAction = function (act) { console.log("[CO Action]", act); };

      var browser = window.CO_Browser.create({
        mount: mount,
        layout: "standalone",
        exposeGlobals: true
      });
      browser.show();

      // Dispatch Steam capabilities and switch to Steam Friends tab
      window.dispatchCoEvent({ type: "capabilities", steamP2p: true });
      window.dispatchCoEvent({ type: "steamStatus", available: true, reason: "", matchmaking: true });

      // Start hosting mock lobby with friend code and connected operatives
      window.dispatchCoEvent({ type: "steamHostStarted", friendCode: "76561198028491042" });
      window.dispatchCoEvent({
        type: "steamLobbyPeers",
        peers: [
          { steamId: "76561198000000043", name: "Piper Wright" },
          { steamId: "76561198000000044", name: "Nick Valentine" }
        ]
      });

      // Switch active tab to steam-friends
      var steamTabBtn = document.querySelector('.co-nav-item[data-tab="steam-friends"]');
      if (steamTabBtn) {
        steamTabBtn.click();
      }
    })();
  </script>
</body>
</html>
