<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonwealth Online — Needs HUD Preview</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        background: linear-gradient(165deg, #09120b 0%, #101a12 45%, #060c07 100%) !important;
      }
      .preview-hint {
        position: fixed;
        left: 28px;
        bottom: 28px;
        font-family: "Bahnschrift", "Arial Narrow", Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(154, 168, 152, 0.7);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="co-needs-hud" id="coNeedsHud" hidden>
      <div class="co-needs-row" id="coNeedsHunger" role="img" aria-label="Hunger">
        <svg class="co-needs-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 2h2.4v7H5zM10.8 2h2.4v7h-2.4zM16.6 2H19v7h-2.4zM5 8.4h14V10a7 7 0 0 1-3.6 6.1V16H8.6v.1A7 7 0 0 1 5 10zM10.5 15h3v7h-3z" />
        </svg>
        <span class="co-needs-track"><span class="co-needs-fill"></span></span>
      </div>
      <div class="co-needs-row" id="coNeedsThirst" role="img" aria-label="Thirst">
        <svg class="co-needs-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C8 7 5 10.5 5 14.8a7 7 0 0 0 14 0C19 10.5 16 7 12 2z" />
        </svg>
        <span class="co-needs-track"><span class="co-needs-fill"></span></span>
      </div>
      <div class="co-needs-row" id="coNeedsSleep" role="img" aria-label="Sleep">
        <svg class="co-needs-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.5 15A9 9 0 1 1 9 4.5a7.2 7.2 0 0 0 10.5 10.5z" transform="translate(0 2)" />
        </svg>
        <span class="co-needs-track"><span class="co-needs-fill"></span></span>
      </div>
    </div>
    <p class="preview-hint">Needs HUD preview · bottom-left above health</p>
    <script src="needs-hud.js"></script>
    <script>
      window.coNeedsSetState(JSON.stringify({ enabled: true, hunger: 0.8, thirst: 0.3, sleep: 0.6 }));
    </script>
  </body>
</html>
