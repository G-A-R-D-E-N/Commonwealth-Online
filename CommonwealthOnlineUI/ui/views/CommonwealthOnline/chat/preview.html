<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonwealth Online — Chat Preview</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      html,
      body {
        background: linear-gradient(165deg, #09120b 0%, #101a12 45%, #060c07 100%) !important;
        pointer-events: auto !important;
      }
      .preview-hint {
        position: fixed;
        left: 28px;
        bottom: 28px;
        font-family: "Bahnschrift", "Arial Narrow", Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(154, 168, 152, 0.7);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <p class="preview-hint">Chat Terminal Preview · Bottom-Right</p>
    <section class="co-chat" id="coChat" aria-label="Chat">
      <header class="co-chat-header">
        <span class="co-chat-title">CHAT</span>
        <div class="co-chat-channels" role="tablist" aria-label="Chat channel">
          <button type="button" class="co-chat-channel" id="coChannelGlobal" role="tab" aria-selected="true">Global</button>
          <button type="button" class="co-chat-channel" id="coChannelFaction" role="tab" aria-selected="false">Faction</button>
        </div>
        <button type="button" class="co-chat-close" id="coChatClose" aria-label="Close chat">&#10005;</button>
      </header>
      <ol class="co-chat-list" id="coChatList" aria-live="polite"></ol>
      <p class="co-chat-status" id="coChatStatus"></p>
      <div class="co-chat-compose">
        <input type="text" id="coChatInput" autocomplete="off" placeholder="Message global chat" />
        <span class="co-chat-count" id="coChatCount">0/256</span>
      </div>
      <p class="co-chat-hint">Enter send &middot; Tab channel &middot; Esc close</p>
    </section>
    <script src="../shared/faction-tag.js"></script>
    <script src="chat.js"></script>
    <script>
      window.coChatEvent({ kind: "state", enabled: true, localPlayerId: "1" });
      window.coChatEvent({
        kind: "history",
        messages: [
          { channel: "global", fromPlayerId: "1", fromName: "VaultDweller_92", text: "Radio check, anyone near Diamond City market?" },
          { channel: "global", fromPlayerId: "2", fromName: "Paladin_Danse", text: "Loud and clear. Brotherhood patrols are clearing Cambridge." },
          { channel: "faction", fromPlayerId: "3", fromName: "Minuteman_Preston", text: "Settlement needs support at Sanctuary Hills." },
          { channel: "global", fromPlayerId: "4", fromName: "SilverShroud", text: "The Shroud watches from the shadows of Goodneighbor." }
        ]
      });
      window.coChatOpen();
    </script>
  </body>
</html>
