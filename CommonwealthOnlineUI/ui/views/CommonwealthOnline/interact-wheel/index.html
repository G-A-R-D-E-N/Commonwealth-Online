<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonwealth Online — Interact</title>
    <link rel="stylesheet" href="../pipboy-theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wheel" id="coWheel" aria-live="polite">
      <header class="wheel-header"><span class="wheel-eyebrow">PLAYER INTERACTION</span><p class="wheel-title" id="coWheelTitle"></p></header>
      <div class="wheel-ring" id="coWheelRing" role="menu" aria-label="Player interaction"></div>
      <p class="wheel-hint"><span>MOVE</span> Choose <i></i> <span>ACTIVATE / A</span> Confirm <i></i> <span>ESC / B</span> Close</p>
    </main>
    <script src="wheel.js"></script>
  </body>
</html>
