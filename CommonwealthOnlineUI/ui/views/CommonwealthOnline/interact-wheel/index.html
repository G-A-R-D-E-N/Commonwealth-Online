<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commonwealth Online — Interact</title>
    <link rel="stylesheet" href="../pipboy-theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wheel" id="coWheel" aria-live="polite">
      <p class="wheel-title" id="coWheelTitle"></p>

    </main>
    <script src="wheel.js"></script>
  </body>
